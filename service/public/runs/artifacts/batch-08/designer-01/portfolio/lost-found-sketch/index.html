<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>校园失物招领 · 示例草图</title>
<style>
:root{--ink:#203c48;--muted:#536973;--bg:#edf3f5;--paper:#fff;--blue:#18586f;--line:#cbd9df;--thumb:#718b98;--track:#edf3f5;--hover:#16485b;--active:#103b4b;color:var(--ink);background:var(--bg);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;line-height:1.7;scrollbar-color:var(--thumb) var(--track);scrollbar-width:thin;scrollbar-gutter:stable}
*{box-sizing:border-box}body{margin:0}a{color:inherit;cursor:pointer;text-decoration:none}a:focus-visible{outline:3px solid var(--blue);outline-offset:5px}a:active{transform:translateY(1px)}[hidden]{display:none!important}header{border-bottom:1px solid var(--line);background:var(--paper)}.bar{max-width:1120px;margin:auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:700;font-size:19px;letter-spacing:.05em}.brand span{display:inline-block;background:var(--blue);color:white;border-radius:6px;padding:0 7px;margin-right:10px}.stamp{font-size:13px;color:var(--muted)}main{max-width:1120px;margin:auto;padding:48px 28px 70px}.eyebrow{font-size:13px;letter-spacing:.1em;color:var(--blue);font-weight:700}h1{font-family:"Songti SC","SimSun",serif;font-size:clamp(32px,5vw,48px);line-height:1.3;margin:12px 0 16px}p{margin:0 0 16px}.intro{max-width:600px;color:var(--muted)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:38px 0 16px}.section-title h2{font-size:18px;margin:0}.section-title span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:block;transition:border-color .15s,box-shadow .15s}.card:hover{border-color:var(--blue);box-shadow:0 5px 16px #203c4812}.art{height:220px;position:relative;background:#dfecef;display:flex;align-items:center;justify-content:center}.art svg{width:80%;height:80%}.badge{position:absolute;top:16px;left:16px;padding:3px 10px;border:1px solid var(--line);background:white;border-radius:4px;font-size:12px;font-weight:700}.content{padding:22px}.content h3{margin:0 0 8px;font-size:21px}.meta{color:var(--muted);font-size:14px;margin-bottom:15px}.feature{font-size:14px;min-height:48px}.open{display:flex;justify-content:space-between;color:var(--blue);font-weight:700;border-top:1px solid var(--line);padding-top:14px;font-size:14px}.note{margin-top:30px;padding:16px 20px;border-left:3px solid var(--blue);color:var(--muted);font-size:14px}.back{display:inline-flex;align-items:center;min-height:44px;color:var(--blue);font-weight:700;margin-bottom:26px}.back:hover{text-decoration:underline}.detail{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;background:white;border:1px solid var(--line);border-radius:12px;padding:30px}.detail .art{height:390px;border-radius:8px}.detail h1{font-size:34px}.detail dl{margin:24px 0}.detail dl div{display:grid;grid-template-columns:86px 1fr;padding:13px 0;border-bottom:1px solid var(--line)}dt{color:var(--muted);font-size:14px}dd{margin:0}.detail .note{margin-top:24px;background:var(--bg)}footer{max-width:1120px;margin:auto;padding:24px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:12px}::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:var(--track)}::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid var(--track);border-radius:6px}::-webkit-scrollbar-thumb:hover{background:var(--hover)}::-webkit-scrollbar-thumb:active{background:var(--active)}@media(max-width:720px){.grid,.detail{grid-template-columns:1fr}.bar{padding:16px 20px}.stamp{font-size:11px}main{padding:32px 20px 48px}.art{height:240px}.detail{padding:20px;gap:24px}.detail .art{height:270px}.feature{min-height:0}footer{flex-direction:column}.section-title{gap:12px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(forced-colors:active){:root{scrollbar-color:auto}.card,.badge,.detail{border:1px solid CanvasText}}
</style>
</head>
<body>
<header><div class="bar"><a class="brand" href="#list"><span aria-hidden="true">拾</span>校园失物招领</a><span class="stamp">HTML 草图 v0.2 · 试用待执行</span></div></header>
<main id="main">
<section id="list"><div class="eyebrow">校园里的失物线索</div><h1>也许，你的东西在这里。</h1><p class="intro">先看看物品，再比对时间、地点和特征。<br>以下均为虚构示例，插画用于展示，不是真实拾物照片。</p><div class="section-title"><h2>拾到的物品</h2><span>共 3 件 · 全部为示例</span></div><div class="grid" id="cards"></div><p class="note">这是可操作草图：可以查看详情、返回列表。这里不收集联系方式，也不会发起真实联系或认领。</p></section>
<section id="detail" hidden aria-labelledby="detail-title"></section>
</main>
<footer><span>探索阶段 · 示例数据 · 未上线</span><span>列表与详情已制作；是否易于辨认，仍待试用验证。</span></footer>
<script>
const items=[
{id:'bottle-blue',name:'深蓝色保温杯',place:'图书馆二楼自习区',date:'10 月 6 日 · 18:20（示例）',short:'银色杯盖，杯身有白色小山贴纸。',description:'深蓝色圆柱杯身，银色旋盖。正面贴有一枚白色小山图案，杯底边缘有轻微磨痕。',type:'保温杯',color:'#274e70',kind:'bottle'},
{id:'bottle-green',name:'浅绿色保温杯',place:'教学楼一层走廊',date:'10 月 7 日 · 12:10（示例）',short:'同色杯盖，杯身带一条深绿色提绳。',description:'浅绿色杯身与杯盖，侧面有深绿色提绳。杯身无贴纸，杯盖顶部有一道浅色划痕。',type:'保温杯',color:'#88b6a2',kind:'bottle'},
{id:'umbrella',name:'深蓝色折叠伞',place:'食堂东侧入口',date:'10 月 7 日 · 13:40（示例）',short:'黑色手柄，收纳带上有一枚圆形纽扣。',description:'深蓝色三折伞，黑色短手柄与腕绳。收纳带使用圆形纽扣，伞套不在。',type:'雨伞',color:'#274e70',kind:'umbrella'}
];
function illustration(item){return `<svg viewBox="0 0 320 240" role="img" aria-label="${item.name}的示例插画"><ellipse cx="160" cy="218" rx="72" ry="8" fill="#203c48" opacity=".1"/>${item.kind==='bottle'?`<rect x="116" y="57" width="88" height="156" rx="22" fill="${item.color}"/><rect x="117" y="35" width="86" height="40" rx="9" fill="${item.id==='bottle-blue'?'#bccbd1':item.color}"/><path d="M125 71h70" stroke="#203c48" opacity=".3"/><path d="M129 90v93" stroke="white" opacity=".18" stroke-width="6" stroke-linecap="round"/>${item.id==='bottle-blue'?'<path d="m139 155 17-27 10 15 9-10 13 22z" fill="#fff"/>':'<path d="M202 67c43 4 31 82 5 70" fill="none" stroke="#386652" stroke-width="8"/>'}`:`<path d="M141 44q20-12 40 0l13 137h-66z" fill="${item.color}"/><path d="m155 48-5 131m17-131 9 131" stroke="#7696ac" stroke-width="2"/><rect x="125" y="116" width="70" height="15" rx="4" fill="#1a364d"/><circle cx="176" cy="123" r="4" fill="#cbd9df"/><rect x="145" y="180" width="32" height="33" rx="9" fill="#29383d"/><path d="M170 203q40 29 31-6" fill="none" stroke="#29383d" stroke-width="4"/>`}</svg>`}
const cards=document.getElementById('cards'),list=document.getElementById('list'),detail=document.getElementById('detail');
cards.innerHTML=items.map(i=>`<a class="card" id="card-${i.id}" href="#item/${i.id}" aria-label="查看${i.name}详情（示例）"><div class="art"><span class="badge">示例物品</span>${illustration(i)}</div><div class="content"><h3>${i.name}</h3><p class="meta">${i.place}<br>${i.date}</p><p class="feature">${i.short}</p><span class="open">查看详情 <span aria-hidden="true">↗</span></span></div></a>`).join('');
let lastItem=null,listScroll=0;
function route(initial=false){const hash=location.hash;if(hash==='#offline-contact'&&!detail.hidden){document.getElementById('offline-contact').focus();return;}const item=items.find(i=>hash===`#item/${i.id}`);if(item){if(!list.hidden)listScroll=window.scrollY;lastItem=item.id;detail.innerHTML=`<a class="back" href="#list">← 返回列表</a><div class="detail"><div class="art"><span class="badge">示例插画 · 非实物照片</span>${illustration(item)}</div><div><div class="eyebrow">示例物品 / ${item.type}</div><h1 id="detail-title" tabindex="-1">${item.name}</h1><p class="intro">请比对下面的线索。外观相似，并不能确认物品归属。</p><dl><div><dt>发现地点</dt><dd>${item.place}（示例）</dd></div><div><dt>发现时间</dt><dd>${item.date}</dd></div><div><dt>物品特征</dt><dd>${item.description}</dd></div></dl><a class="back" href="#offline-contact">线下联系失物招领处 →</a><section id="offline-contact" tabindex="-1"><h2>线下联系说明</h2><p>如需进一步核实，请线下联系失物招领处。本原型不要求填写手机号。</p><p>失物招领处具体地点、开放时间与核验要求待补充；当前不能据此安排真实到访。这里不表示示例物品已交由失物招领处保管。</p></section><p class="note">本条信息完全虚构，仅供草图试用。本页不填写手机号。真实核实与认领未测试。</p></div></div>`;list.hidden=true;detail.hidden=false;document.title=`${item.name}（示例） · 校园失物招领`;window.scrollTo(0,0);if(!initial)document.getElementById('detail-title').focus();}else{detail.hidden=true;list.hidden=false;document.title='校园失物招领 · 示例草图';if(!initial&&lastItem){document.getElementById(`card-${lastItem}`).focus({preventScroll:true});window.scrollTo(0,listScroll);}}}
window.addEventListener('hashchange',()=>route());route(true);
</script>
</body>
</html>
