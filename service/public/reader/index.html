<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0b14">
  <meta name="robots" content="noindex, nofollow">
  <title>Obelisk 私密分享</title>
  <link rel="icon" href="/site/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/site/brand.css">
  <link rel="stylesheet" href="/reader/style.css">
  <script type="module" src="/reader/app.js"></script>
<link rel="stylesheet" href="/site/language.css"><script type="module" src="/site/i18n.js"></script></head>
<body>
  <header class="topbar">
    <span class="ob-brand" role="img" aria-label="Obelisk">
      <img class="ob-mark" src="/site/logo.svg" alt="" width="19" height="23">
      <span class="ob-word" aria-hidden="true"><span class="ob-word-a">Obe</span><img class="ob-word-l" src="/site/wordmark-l.svg" alt="" width="7" height="21"><span class="ob-word-b">isk</span></span>
    </span>
    <span class="topbar-title" id="topbar-title">私密分享</span>
    <span class="topbar-wallet" id="topbar-wallet" hidden></span>
  </header>

  <main id="app" class="page" aria-live="polite">
    <section class="panel center loading" id="boot">
      <div class="spinner" aria-hidden="true"></div>
      <p class="muted">正在读取分享…</p>
      <noscript><p>这个页面需要启用 JavaScript 才能在浏览器里解密内容。</p></noscript>
    </section>
  </main>

  <div class="watermark" id="watermark" aria-hidden="true" hidden></div>

  <footer class="footer">
    <p>内容在你的浏览器里解密，Obelisk 在线服务看不到原文。打开规则与回执记录在 BOT Chain 上，任何人都可以核对。</p>
    <p class="muted">Obelisk 不会向你索要私钥或助记词。签名只在你的钱包里完成。</p>
  </footer>
</body>
</html>
